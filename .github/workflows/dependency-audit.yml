name: Dependency audit

# NFR-006: no known vulnerability of high severity or worse in the packages the app ships. It runs
# on every pull request and every push to main, and every Monday, because a vulnerability can be
# published for a package that has not changed.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

# Least privilege: this job only reads the repository.
permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Audit the shipped packages
        # Only the runtime packages (the ones in the release SBOM). The development tools are not
        # shipped; Dependabot updates them. The audit reads package-lock.json, so nothing is installed.
        run: npm audit --omit=dev --audit-level=high
