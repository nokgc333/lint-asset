name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

# Least privilege: these jobs only read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  public-paths:
    name: public-paths
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check that every tracked path is allowlisted
        run: python3 scripts/check-public-paths.py

  commit-messages:
    name: commit-messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check every commit in the pull request
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          for sha in $(git rev-list "$BASE_SHA..$HEAD_SHA"); do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/message.txt"
            if ! python3 scripts/check-commit-message.py "$RUNNER_TEMP/message.txt"; then
              echo "::error::commit $sha has an invalid message"
              status=1
            fi
          done
          exit "$status"

  branch-name:
    name: branch-name
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the pull request branch name
        env:
          BRANCH: ${{ github.head_ref }}
        run: python3 scripts/check-branch-name.py "$BRANCH"

  pr-title-and-body:
    name: pr-title-and-body
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the pull request title and body
        # The title and body are untrusted text: pass them through env, never inline.
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n' "$PR_TITLE" > "$RUNNER_TEMP/title.txt"
          python3 scripts/check-commit-message.py "$RUNNER_TEMP/title.txt"
          body=$(printf '%s\n' "$PR_BODY" | tr -d '\r')
          for heading in "## Purpose" "## Changes" "## Verification"; do
            if ! printf '%s\n' "$body" | grep -qxF "$heading"; then
              echo "::error::the pull request body must contain the heading '$heading'"
              exit 1
            fi
          done

  format:
    name: format
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check C++ formatting
        # Pinned to the same clang-format version as local development.
        run: |
          find core tests \( -name '*.cpp' -o -name '*.hpp' \) -print0 \
            | xargs -0 pipx run --spec clang-format==23.1.5 clang-format --dry-run -Werror

  native-tests:
    name: native-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CC: clang-18
      CXX: clang++-18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure
        run: cmake -S . -B build/native -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build/native
      - name: Test (AddressSanitizer and UBSan are on)
        run: ctest --test-dir build/native --output-on-failure

  web:
    name: web
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies exactly as locked
        run: npm ci --ignore-scripts
      - name: Lint and check formatting
        run: npx --no-install biome ci .
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:web
      - name: Validate the report schema
        run: npm run test:schema

  wasm-build:
    name: wasm-build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      # The official Emscripten image, pinned by digest so every run uses the same toolchain.
      image: emscripten/emsdk:7.0.0@sha256:6bd7aef93408b10bf7b36642cb7c91119b302f720b9ec2d20439f73cf07fe894
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the WASM module
        run: |
          emcmake cmake -S . -B build/wasm -DCMAKE_BUILD_TYPE=Release
          cmake --build build/wasm
      - name: Check the compressed size
        run: python3 scripts/check-wasm-size.py web/src/wasm/lint_core.wasm
      - name: Check that the module needs no eval
        # The production CSP forbids eval and new Function, so the glue code must not use them.
        run: |
          if grep -nE 'new Function|[^a-zA-Z_.]eval\(' web/src/wasm/lint_core.mjs; then
            echo "::error::the WASM glue code uses eval or new Function"
            exit 1
          fi
      - name: Run the module in Node.js
        run: |
          emcmake cmake -S . -B build/wasm-node -DCMAKE_BUILD_TYPE=Release \
            -DLINT_ASSET_WASM_NODE=ON -DLINT_ASSET_WASM_DEST="$PWD/build/wasm-node/dist"
          cmake --build build/wasm-node
          cd build/wasm-node/dist
          node --input-type=module -e "
            import createLintCore from './lint_core.mjs';
            const core = await createLintCore();
            console.log('version:', core.version());
            if (core.version() !== '0.0.0') process.exit(1);"
      - name: Check the GLB loader in Node.js
        run: |
          python3 tests/tools/make_test_glbs.py build/wasm-node/glb
          node scripts/check-wasm-loader.mjs build/wasm-node/dist build/wasm-node/glb tests/golden
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wasm-module
          path: |
            web/src/wasm/lint_core.mjs
            web/src/wasm/lint_core.wasm
          if-no-files-found: error
          retention-days: 7

  web-build:
    name: web-build
    needs: wasm-build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wasm-module
          path: web/src/wasm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies exactly as locked
        run: npm ci --ignore-scripts
      - name: Build the web app
        run: npx --no-install vite build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: build/web
          if-no-files-found: error
          retention-days: 7

  accessibility:
    name: accessibility
    needs: web-build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: build/web
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies exactly as locked
        run: npm ci --ignore-scripts
      - name: Check the built app with axe and the keyboard
        # The runner image has Google Chrome. puppeteer-core drives it; nothing is downloaded.
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node scripts/audit-accessibility.mjs build/web
