name: Native dependencies

# The C++ dependencies and the Emscripten toolchain are pinned by hand, so neither npm audit nor
# Dependabot sees them. Every Wednesday this checks that each pinned version is the latest release
# of its project, and that the project has no published security advisory that has not been
# reviewed (scripts/native-deps-reviewed.json). A failed scheduled run is what makes GitHub send a
# notification. On a pull request it only prints the report.

on:
  schedule:
    - cron: "37 6 * * 3"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/native-deps.yml"
      - "core/CMakeLists.txt"
      - "tests/CMakeLists.txt"
      - "scripts/check-native-deps.mjs"
      - "scripts/native-deps-reviewed.json"

# Least privilege: this job only reads the repository.
permissions:
  contents: read

concurrency:
  group: native-deps-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-deps:
    name: native-deps
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Report the pinned versions
        if: github.event_name == 'pull_request'
        run: node scripts/check-native-deps.mjs
      - name: Check the pinned versions and the advisories
        if: github.event_name != 'pull_request'
        run: node scripts/check-native-deps.mjs --fail
